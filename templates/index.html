<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Analytics Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background-color: #f4f6f9; }
        .container { max-width: 850px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 20px; }
        h2 { color: #34495e; font-size: 18px; margin-top: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 10px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e1e1e1; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; color: #333; }
        .risk-at-risk { color: #d9534f; font-weight: bold; }
        .risk-safe { color: #5cb85c; font-weight: bold; }
        .stats-box { background: #e9ecef; padding: 12px; border-radius: 4px; margin-top: 20px; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Student Attendance & Grade Analytics Portal</h1>

    <form id="studentForm">
        <div class="form-group">
            <label>Student Name</label>
            <input type="text" id="name" placeholder="e.g. Rahul Sharma" required>
        </div>
        <div class="form-group">
            <label>Attendance (%)</label>
            <input type="number" id="attendance" min="0" max="100" step="0.1" placeholder="e.g. 75" required>
        </div>
        <div class="form-group">
            <label>Marks Score (0-100)</label>
            <input type="number" id="marks" min="0" max="100" step="0.1" placeholder="e.g. 68" required>
        </div>
        <button type="submit">Submit Entry</button>
    </form>

    <div class="stats-box">
        <strong>Overall Class Average:</strong> <span id="classAvg">0</span>
    </div>

    <h2>Student Database Records</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Attendance</th>
                <th>Marks</th>
                <th>Status</th>
                <th>Risk Prediction</th>
            </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
    </table>
</div>

<script>
    async function loadData() {
        const response = await fetch('/api/students');
        const data = await response.json();
        
        document.getElementById('classAvg').innerText = data.class_average + ' / 100';
        
        const tbody = document.getElementById('studentTableBody');
        tbody.innerHTML = '';
        
        data.students.forEach(student => {
            const row = document.createElement('tr');
            const riskClass = student.risk_level === 'At Risk' ? 'risk-at-risk' : 'risk-safe';
            
            row.innerHTML = `
                <td>${student.id}</td>
                <td>${student.name}</td>
                <td>${student.attendance}%</td>
                <td>${student.marks}</td>
                <td>${student.status}</td>
                <td class="${riskClass}">${student.risk_level}</td>
            `;
            tbody.appendChild(row);
        });
    }

    document.getElementById('studentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const attendance = document.getElementById('attendance').value;
        const marks = document.getElementById('marks').value;

        await fetch('/api/students', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, attendance, marks })
        });

        document.getElementById('studentForm').reset();
        loadData();
    });

    loadData();
</script>

</body>
</html>
